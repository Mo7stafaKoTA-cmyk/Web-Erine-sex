<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Cairo Font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Container -->
    <div class="w-full max-w-md">

        <!-- Login Card -->
        <div id="loginCard" class="glass-card rounded-2xl p-8 shadow-2xl transition-all duration-300">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600/30 rounded-2xl mb-4 border border-indigo-500/30 text-indigo-400 text-2xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-1">مرحباً بك</h2>
                <p class="text-slate-400 text-sm">سجّل الدخول باستخدام رقم الهاتف وكلمة المرور</p>
            </div>

            <!-- Error Message Alert -->
            <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border"></div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">رقم الهاتف</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400">
                            <i class="fa-solid fa-phone"></i>
                        </span>
                        <input type="text" id="phoneInput" required placeholder="01xxxxxxxxx" dir="ltr"
                            class="w-full bg-slate-900/60 text-white placeholder-slate-500 rounded-xl pr-10 pl-4 py-3 border border-slate-700/60 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-right">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">كلمة المرور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="passInput" required placeholder="••••••••"
                            class="w-full bg-slate-900/60 text-white placeholder-slate-500 rounded-xl pr-10 pl-4 py-3 border border-slate-700/60 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
                    تسجيل الدخول
                </button>
            </form>
        </div>

        <!-- Dashboard (Hidden by Default) -->
        <div id="dashboardCard" class="hidden glass-card rounded-2xl p-8 shadow-2xl text-white">
            <div class="flex items-center justify-between pb-6 border-b border-slate-700/60 mb-6">
                <div>
                    <h2 class="text-xl font-bold">لوحة التحكم</h2>
                    <p class="text-xs text-slate-400" id="userRoleBadge"></p>
                </div>
                <button onclick="logout()" class="text-sm bg-red-500/20 text-red-400 hover:bg-red-500/30 px-3 py-1.5 rounded-lg border border-red-500/30 transition">
                    خروج <i class="fa-solid fa-right-from-bracket mr-1"></i>
                </button>
            </div>

            <div class="bg-indigo-950/40 border border-indigo-500/20 rounded-xl p-4 mb-6">
                <p class="text-sm text-indigo-200">أهلاً بك 👋، لقد سجلت الدخول بنجاح عبر الرقم:</p>
                <p class="text-lg font-bold text-indigo-400 mt-1" id="loggedInPhone" dir="ltr"></p>
            </div>

            <!-- Admin Section -->
            <div id="adminSection" class="hidden space-y-4">
                <h3 class="font-bold text-indigo-300 text-sm border-b border-slate-700/40 pb-2">إدارة أرقام المشتركين (الأدمن)</h3>
                
                <form onsubmit="addUser(event)" class="space-y-3 bg-slate-900/40 p-4 rounded-xl border border-slate-800">
                    <input type="text" id="newPhone" placeholder="رقم الهاتف الجديد" required dir="ltr"
                        class="w-full bg-slate-800 text-sm text-white rounded-lg px-3 py-2 border border-slate-700 focus:outline-none focus:border-indigo-500">
                    <input type="text" id="newPass" placeholder="كلمة المرور" required
                        class="w-full bg-slate-800 text-sm text-white rounded-lg px-3 py-2 border border-slate-700 focus:outline-none focus:border-indigo-500">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold py-2 rounded-lg transition">
                        + إضافة الرقم للقائمة
                    </button>
                </form>

                <div class="mt-4">
                    <p class="text-xs text-slate-400 mb-2">الأرقام المسجلة حالياً:</p>
                    <div id="usersList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const initialUsers = [
            { phone: "01000000000", pass: "password123", role: "admin" },
            { phone: "01012345678", pass: "pass123", role: "user" }
        ];

        function getUsers() {
            const stored = localStorage.getItem("site_users");
            if (!stored) {
                localStorage.setItem("site_users", JSON.stringify(initialUsers));
                return initialUsers;
            }
            return JSON.parse(stored);
        }

        function showAlert(msg, isError = true) {
            const box = document.getElementById("alertBox");
            box.classList.remove("hidden", "bg-red-500/20", "border-red-500/40", "text-red-300", "bg-emerald-500/20", "border-emerald-500/40", "text-emerald-300");
            if (isError) {
                box.classList.add("bg-red-500/20", "border-red-500/40", "text-red-300");
            } else {
                box.classList.add("bg-emerald-500/20", "border-emerald-500/40", "text-emerald-300");
            }
            box.innerText = msg;
        }

        function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById("phoneInput").value.trim();
            const pass = document.getElementById("passInput").value.trim();
            const users = getUsers();

            const found = users.find(u => u.phone === phone && u.pass === pass);

            if (found) {
                showAlert("تم تسجيل الدخول بنجاح!", false);
                setTimeout(() => {
                    showDashboard(found);
                }, 600);
            } else {
                showAlert("رقم الهاتف أو كلمة المرور غير صحيحة!");
            }
        }

        function showDashboard(user) {
            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("dashboardCard").classList.remove("hidden");
            document.getElementById("loggedInPhone").innerText = user.phone;
            document.getElementById("userRoleBadge").innerText = user.role === "admin" ? "حساب مسؤول (أدمن)" : "حساب مستخدم";

            if (user.role === "admin") {
                document.getElementById("adminSection").classList.remove("hidden");
                renderUsersList();
            }
        }

        function renderUsersList() {
            const users = getUsers();
            const container = document.getElementById("usersList");
            container.innerHTML = "";

            users.forEach((u, idx) => {
                const div = document.createElement("div");
                div.className = "flex items-center justify-between bg-slate-800/60 p-2.5 rounded-lg text-xs border border-slate-700/50";
                div.innerHTML = `
                    <span dir="ltr" class="font-mono text-slate-200">${u.phone} (${u.pass})</span>
                    ${u.role !== 'admin' ? `<button onclick="deleteUser(${idx})" class="text-red-400 hover:text-red-300 font-bold px-2 py-1">حذف</button>` : `<span class="text-indigo-400">أدمن</span>`}
                `;
                container.appendChild(div);
            });
        }

        function addUser(e) {
            e.preventDefault();
            const phone = document.getElementById("newPhone").value.trim();
            const pass = document.getElementById("newPass").value.trim();

            if (!phone || !pass) return;

            const users = getUsers();
            users.push({ phone, pass, role: "user" });
            localStorage.setItem("site_users", JSON.stringify(users));

            document.getElementById("newPhone").value = "";
            document.getElementById("newPass").value = "";
            renderUsersList();
        }

        function deleteUser(idx) {
            const users = getUsers();
            users.splice(idx, 1);
            localStorage.setItem("site_users", JSON.stringify(users));
            renderUsersList();
        }

        function logout() {
            document.getElementById("dashboardCard").classList.add("hidden");
            document.getElementById("loginCard").classList.remove("hidden");
            document.getElementById("alertBox").classList.add("hidden");
            document.getElementById("phoneInput").value = "";
            document.getElementById("passInput").value = "";
        }
    </script>
</body>
</html>
